# Filebeat config — ships the app's container logs to Elasticsearch.
#
# Approach: an explicit `container` input that tails every container's
# stdout log file directly, then keeps only containers that opted in.
# (We deliberately avoid hints-based docker autodiscover — it proved
# finicky on Docker Desktop and silently created zero inputs.)
#
# Pipeline per line:
#   1. `container` input unwraps Docker's json-file envelope
#      ({"log":"<app line>","stream":"stdout","time":...}) → message = app line.
#   2. add_docker_metadata enriches with container.* (name, image, id, labels).
#   3. drop_event keeps ONLY containers carrying the `logging: notifier` label
#      (set on the app service in docker-compose.yml), so Elasticsearch holds
#      just our app's logs (no postgres/redis/kibana noise). A label is used —
#      not the container/image name — so the filter is an explicit opt-in that
#      survives project renames and works with multiple replicas.
#   4. decode_json_fields parses the app's slog JSON line and lifts its fields
#      (level, msg, repo, request_id, ...) to the document root for Kibana.

filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log

processors:
  - add_docker_metadata: ~
  # Keep only containers explicitly opted in via the `logging: notifier`
  # label. Dropped BEFORE decoding to save work on irrelevant containers.
  - drop_event:
      when:
        not:
          equals:
            container.labels.logging: "notifier"
  # The container input leaves the app's slog line as a raw JSON string in
  # `message`. Decode it and lift level/msg/repo/request_id/... to the root
  # so they become first-class searchable fields in Kibana.
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "notifier-logs-%{+yyyy.MM.dd}"

# A custom index name requires turning OFF the default ILM policy, otherwise
# Filebeat 8.x ignores `index:` above and writes to filebeat-<version>-*.
setup.ilm.enabled: false
setup.template.name: "notifier-logs"
setup.template.pattern: "notifier-logs-*"

setup.kibana:
  host: "http://kibana:5601"

logging.level: info
logging.metrics.enabled: false
