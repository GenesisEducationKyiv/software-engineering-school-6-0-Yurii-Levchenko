# Observability stack: log pipeline (Elasticsearch + Kibana + Filebeat).
#
# Kept in a SEPARATE compose file so normal dev/test runs stay light.
# Run together with the app stack by merging both files:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build -d
#
# Merging puts all services on the same project network, so Filebeat can
# reach Elasticsearch and Kibana, and the app's container logs are visible
# to Filebeat via the mounted Docker log directory.
#
# Security is intentionally disabled (xpack.security.enabled=false) — this is
# a local dev/learning setup, not production. Do NOT expose these ports
# publicly.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: notifier-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m   # cap heap so it doesn't eat all Docker RAM
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12   # ES is slow to boot; give it ~2 min
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: notifier-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: notifier-filebeat
    user: root
    # --strict.perms=false: the mounted config file isn't owned by root inside
    # the container; without this Filebeat refuses to start.
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Container stdout logs live here (json-file driver). Read-only.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Docker socket for container metadata enrichment + autodiscover.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Prometheus: pulls /metrics from the app every 15s and stores them as
  # time series. The "metrics export pipeline" for the RED metrics.
  # UI + PromQL at http://localhost:9090.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: notifier-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  # Grafana: dashboards over Prometheus. Datasource + dashboard are
  # provisioned from files (as code) — nothing to click in the UI.
  # Anonymous access is on (dev only) so the dashboard opens without login.
  # UI at http://localhost:3000.
  grafana:
    image: grafana/grafana:11.2.2
    container_name: notifier-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      # Provisioning: auto-register the Prometheus datasource + dashboard provider.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard JSON the provider above loads from.
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  esdata:
  promdata:
  grafanadata:
